name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Get version name
      id: version
      run: |
        VERSION=$(grep -E '^\s*versionName = ' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk dns-optimizer-pro-v${{ steps.version.outputs.version }}-debug.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: dns-optimizer-pro-v${{ steps.version.outputs.version }}
        path: dns-optimizer-pro-v${{ steps.version.outputs.version }}-debug.apk
        if-no-files-found: error

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: "DNS Optimizer Pro v${{ steps.version.outputs.version }}"
        body: |
          ## DNS Optimizer Pro v${{ steps.version.outputs.version }}
          
          Gaming DNS optimization for Android.
          
          ### Features
          - Connect to optimized DNS for gaming
          - 20+ curated DNS providers
          - VPN-based DNS routing
          - Real-time DNS benchmarking
          - Gaming profiles (Steam, Epic, Riot, etc.)
          - Dark gaming theme
          
          ### Installation
          1. Download the APK below
          2. Enable "Install from unknown sources"
          3. Install and grant VPN permission
          
          ### What's New
          - See commit history for changes
        files: dns-optimizer-pro-v${{ steps.version.outputs.version }}-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Auto Release (on main push)
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        name: "DNS Optimizer Pro v${{ steps.version.outputs.version }}-build.${{ github.run_number }}"
        body: |
          ## Latest Build
          
          Auto-generated from main branch.
          
          ### Installation
          1. Download the APK below
          2. Enable "Install from unknown sources"
          3. Install and grant VPN permission
        files: dns-optimizer-pro-v${{ steps.version.outputs.version }}-debug.apk
        tag_name: auto-build-${{ github.run_number }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
